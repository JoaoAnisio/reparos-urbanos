name: reparos
version: "1.0.0"
config-version: 2
profile: reparos

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

models:
  reparos:
    staging:
      +materialized: view
      +schema: staging
    core:
      +materialized: table
      +schema: core
    marts:
      +materialized: table
      +schema: marts

seeds:
  reparos:
    +schema: core
    distrito_subprefeitura:
      +column_types:
        distrito: varchar
        subprefeitura: varchar
        zona: varchar

vars:
  # Score de prioridade (mart_fila_prioridade) = 10 x soma ponderada dos componentes (0 a 1).
  # Os pesos precisam somar 1 (teste assert_pesos_somam_1).
  peso_espera: 0.30
  peso_via: 0.25
  peso_demanda: 0.15
  peso_reincidencia: 0.15
  peso_equidade: 0.15
  # Tetos de normalização: a partir deles o componente vale 1.
  teto_espera_dias: 30            # espera = dias_em_aberto / 30
  teto_demanda_chamados: 10       # demanda = ln(1 + qtd_chamados) / ln(1 + 10)
  teto_reincidencia: 3            # reincidência = numero_reincidencia / 3
  # Abertas há mais que isso têm status possivelmente desatualizado: confirmar em campo.
  dias_verificar_em_campo: 180
